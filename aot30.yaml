# Fujitsu legacy wired-remote controller; reference hardware: ART30RL / AOT30L.
# Disconnect the wired remote before enabling the master, or configure relay isolation.
# Wiring and operation: docs/aot30-circuit.md and docs/aot30-master-controller.md.

esphome:
  name: aircon
  friendly_name: "Aircon"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Keep the heat-pump bus running during network outages.
  reboot_timeout: 0s

  ap:
    ssid: "Aircon-Fallback"
    password: !secret fallback_ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome

external_components:
  - source: github://matt-nz/fujitsu-legacy-esphome@main
    components: [ fujitsu_aot30 ]
    refresh: always

# rx_pin = GPIO16 (from the transceiver's TXD pin), tx_pin = GPIO17 (to the transceiver's RXD pin).
# Set debug: true temporarily for raw receive logs; INFO/WARN/ERROR messages remain enabled without it.
climate:
  - platform: fujitsu_aot30
    name: "Fujitsu Heat Pump"
    id: fujitsu_hp
    rx_pin: 16
    tx_pin: 17
    debug: false
    # Optional normally-closed relay isolates remote power and LIN during HA commands.
    # Master Controller on holds the remote isolated for continuous ESP control.
    # remote_relay_pin: 25
    # remote_relay_inverted: false   # true if your driver is active low

# Native ESPHome warning/error indication instead of custom connection effects.
status_led:
  pin:
    number: GPIO2
    inverted: false

web_server:
  port: 80
  version: 2
  log: false
  # Authentication does not encrypt HTTP; use only on a trusted LAN.
  auth:
    username: !secret web_username
    password: !secret web_password

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 30s

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s

# The climate entity shows the state the Master Controller last commanded (or, with the Master Controller off and the
# wired remote connected, a best-effort view of what the bus shows). In HA's Auto mode the climate card hides the
# target temperature, so this number shows and sets it in every mode.
number:
  - platform: template
    name: "Set Temperature"
    id: fujitsu_set_temperature
    icon: "mdi:thermometer"
    entity_category: diagnostic
    min_value: 18
    max_value: 30
    step: 1
    update_interval: 5s
    lambda: |-
      if (std::isnan(id(fujitsu_hp).target_temperature))
        return {};
      return id(fujitsu_hp).target_temperature;
    set_action:
      - lambda: |-
          id(fujitsu_hp).make_call().set_target_temperature(x).perform();

# Mode, fan speed and Economy Mode as separate entities, because the ESPHome web UI's climate row does not give a usable
# control for them. In Home Assistant use the climate entity itself (a Thermostat card). This unit has fan
# Auto/Low/Medium/High (no Quiet).
select:
  # Mode for the web UI; commands require the master or a configured takeover relay.
  - platform: template
    name: "Mode"
    id: fujitsu_mode
    icon: "mdi:air-conditioner"
    update_interval: 5s
    options:
      - "Off"
      - "Auto"
      - "Cool"
      - "Heat"
      - "Fan Only"
    lambda: |-
      switch (id(fujitsu_hp).mode) {
        case climate::CLIMATE_MODE_OFF: return std::string("Off");
        case climate::CLIMATE_MODE_AUTO: return std::string("Auto");
        case climate::CLIMATE_MODE_COOL: return std::string("Cool");
        case climate::CLIMATE_MODE_HEAT: return std::string("Heat");
        case climate::CLIMATE_MODE_FAN_ONLY: return std::string("Fan Only");
        default: return {};
      }
    set_action:
      - lambda: |-
          climate::ClimateMode m = climate::CLIMATE_MODE_OFF;
          if (x == "Auto") m = climate::CLIMATE_MODE_AUTO;
          else if (x == "Cool") m = climate::CLIMATE_MODE_COOL;
          else if (x == "Heat") m = climate::CLIMATE_MODE_HEAT;
          else if (x == "Fan Only") m = climate::CLIMATE_MODE_FAN_ONLY;
          id(fujitsu_hp).make_call().set_mode(m).perform();

  - platform: template
    name: "Fan Speed"
    id: fujitsu_fan_speed
    icon: "mdi:fan"
    update_interval: 5s
    options:
      - "Auto"
      - "Low"
      - "Medium"
      - "High"
    lambda: |-
      if (!id(fujitsu_hp).fan_mode.has_value())
        return {};
      switch (id(fujitsu_hp).fan_mode.value()) {
        case climate::CLIMATE_FAN_AUTO: return std::string("Auto");
        case climate::CLIMATE_FAN_LOW: return std::string("Low");
        case climate::CLIMATE_FAN_MEDIUM: return std::string("Medium");
        case climate::CLIMATE_FAN_HIGH: return std::string("High");
        default: return {};
      }
    set_action:
      - lambda: |-
          climate::ClimateFanMode m = climate::CLIMATE_FAN_AUTO;
          if (x == "Low") m = climate::CLIMATE_FAN_LOW;
          else if (x == "Medium") m = climate::CLIMATE_FAN_MEDIUM;
          else if (x == "High") m = climate::CLIMATE_FAN_HIGH;
          id(fujitsu_hp).make_call().set_fan_mode(m).perform();

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address
    ssid:
      name: "WiFi SSID"
    mac_address:
      name: "MAC Address"

  - platform: version
    name: "ESPHome Version"

  # Master Controller state: Off, Checking bus, Running, or why it refused / stopped.
  - platform: template
    name: "Master Controller Status"
    id: master_controller_status
    icon: "mdi:remote"
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      return id(fujitsu_hp)->master_controller_status();

  # Did the unit echo the last setting / power-off the Master Controller sent? (It repeats what it accepts.)
  - platform: template
    name: "Master Last Command"
    id: master_last_command
    icon: "mdi:check-network-outline"
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      return id(fujitsu_hp)->master_last_command();

  # Bus OK / No Signal / Never Seen, from the recognised messages on the bus.
  - platform: template
    name: "Bus Status"
    id: bus_status
    icon: "mdi:swap-horizontal"
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      return id(fujitsu_hp)->bus_status();

binary_sensor:
  - platform: status
    name: "Status"
    id: system_status

  - platform: template
    name: "Bus Alive"
    id: bus_alive
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(fujitsu_hp)->bus_alive();

  # The run flag in the unit's own replies; unknown until the unit has answered a poll.
  - platform: template
    name: "Unit Running"
    id: unit_running
    device_class: running
    lambda: |-
      const int state = id(fujitsu_hp)->unit_run_state();
      if (state < 0) return {};
      return state == 1;

switch:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

  # Continuous polling; remote must be disconnected or relay-isolated.
  # Turning this off stops polling, not the unit immediately. Use climate Off to send an off command.
  # First boot is passive. Once enabled, restore on across reboots; an intentional off is also saved.
  # The interval below reflects refusals and faults.
  - platform: template
    name: "Master Controller"
    id: master_controller
    icon: "mdi:remote"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(fujitsu_hp)->set_master_controller(true);'
    turn_off_action:
      - lambda: 'id(fujitsu_hp)->set_master_controller(false);'

  - platform: template
    name: "Economy Mode"
    id: fujitsu_economy_mode
    icon: "mdi:leaf"
    lambda: |-
      return id(fujitsu_hp).preset == climate::CLIMATE_PRESET_ECO;
    turn_on_action:
      - lambda: |-
          id(fujitsu_hp).make_call().set_preset(climate::CLIMATE_PRESET_ECO).perform();
    turn_off_action:
      - lambda: |-
          id(fujitsu_hp).make_call().set_preset(climate::CLIMATE_PRESET_NONE).perform();

interval:
  # Keep the Master Controller switch in step with the firmware (it turns itself off on a refusal or a fault).
  - interval: 1s
    then:
      - lambda: |-
          const bool active = id(fujitsu_hp)->master_controller_active();
          if (id(master_controller).state != active) {
            id(master_controller).publish_state(active);
          }
